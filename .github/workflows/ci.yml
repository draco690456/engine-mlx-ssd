name: CI

on:
  workflow_dispatch:

env:
  CARGO_CHECK_ARGS: ""

jobs:
  check:
    name: Check (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --all-targets ${{ env.CARGO_CHECK_ARGS }}
      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --all-targets ${{ env.CARGO_CHECK_ARGS }} -- -D warnings
