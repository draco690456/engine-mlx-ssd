[workspace]
resolver = "2"
members = [
    "crates/nxm-ops-core",
    "crates/nxm-cache-core",
    "crates/nxm-attention-core",
    "crates/nxm-model-core",
    "crates/nxm-tokenizer",
    "crates/model-plan",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nxm-ai/nxm-core"

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fancy-regex = "0.14"
unicode-normalization = "0.1"
nxm-shared = { path = "../nxm-shared" }