[package]
name = "nxm-shared"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared types for NXM servers — OpenAI protocol, config, streaming"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }