[package]
name = "nxm_sampler"
version = "0.1.0"
edition = "2021"
description = "GPU-resident token sampler — top-k, top-p, temperature, repetition penalty. No CPU readback."
license = "MIT"
build = "build.rs"

[dependencies]
objc2 = "0.6"
objc2-metal = "0.3"
objc2-foundation = "0.3"
anyhow = "1"
tracing = "0.1"
